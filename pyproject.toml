[project]
name = "sen2p"
version = "0.1.0"
description = "Lightweight library for downloading Sentinel-2 satellite imagery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "sen2p contributors" }
]
keywords = ["sentinel", "sentinel-2", "satellite", "imagery", "copernicus", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.34.2",
    "sentinelsat>=1.2.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/sen2p"
Repository = "https://github.com/yourusername/sen2p"
Documentation = "https://github.com/yourusername/sen2p#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sen2p"]

[tool.ruff]
# Включает экспериментальные функции, включая форматирование Markdown
preview = true
line-length = 88
target-version = "py310"

# Исключаем директории
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Выбираем правила линтинга
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Игнорируем некоторые правила
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sen2p"]

[tool.ruff.format]
# Форматирование
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Форматирование docstrings
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
# Настройки mypy для проверки типов
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "sentinelsat.*"
ignore_missing_imports = true
